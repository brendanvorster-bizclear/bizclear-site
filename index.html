<title>You Are</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.youare.nz/">
<script>
  // bizclear.nz now lives at youare.nz. Old App Fast links (bizclear.nz/#privacy etc.)
  // still go to App Fast's pages; everything else goes to the home page.
  (function () {
    var appFast = ['#privacy', '#terms', '#support', '#features', '#faq', '#how-it-works', '#food-for-thought'];
    var h = window.location.hash;
    window.location.replace(appFast.indexOf(h) !== -1 ? 'https://www.youare.nz/appfast' + h : 'https://www.youare.nz/');
  })();
</script>
<meta http-equiv="refresh" content="2; url=https://www.youare.nz/">
</head>
